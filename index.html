<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<title>SA &amp; Broker Comm Claim</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button id="backBtn" class="iconbtn" hidden aria-label="Back">&#8592;</button>
  <div class="bar-title"><span class="brand">TOYOTA</span> <span id="title">SA &amp; Broker Comm Claim</span></div>
</header>
<main id="listView">
  <div id="orderList"></div>
  <p id="emptyMsg" class="empty" hidden>No forms yet.<br>Tap <b>+ New form</b> to start a Calculations Form.</p>
  <button id="newBtn" class="fab">+ New form</button>
</main>
<main id="editView" hidden>
  <form id="form" autocomplete="off" onsubmit="return false"></form>
  <div class="spacer"></div>
</main>
<footer id="editBar" class="editbar" hidden>
  <div class="due"><small>Total selling price</small><b id="dueVal">RM 0.00</b></div>
  <button id="pdfBtn" class="primary">PDF</button>
</footer>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <h3>Export PDF (A4)</h3>
    <div id="sheetBody"></div>
    <button class="ghost" id="sheetClose">Close</button>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
